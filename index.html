<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>天悦课本伴学 · 全部学期</title>
<style>
  :root{--bg:#fff7ed;--brand:#e8590c;--brand2:#f08c00;--ink:#343a40;--muted:#868e96;--card:#fff;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}
  header{background:linear-gradient(135deg,#e8590c,#f08c00);color:#fff;padding:34px 20px 28px;text-align:center;}
  header h1{margin:0 0 8px;font-size:25px;}
  header p{margin:4px 0;opacity:.95;font-size:14px;}
  .tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:18px 10px 4px;}
  .tab{cursor:pointer;border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:15px;}
  .tab.active{background:var(--brand);color:#fff;}
  .wrap{max-width:1040px;margin:0 auto;padding:18px 16px 50px;}
  .idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .idx-card{background:var(--card);border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.06);padding:16px 18px;border-top:5px solid var(--brand2);}
  .idx-grade{font-size:18px;font-weight:800;margin-bottom:12px;color:var(--ink);}
  .idx-btns{display:flex;gap:10px;}
  .idx-btn{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:15px;border-radius:12px;padding:11px 0;color:#fff;background:var(--brand);transition:.15s;}
  .idx-btn:hover{background:var(--brand2);}
  .idx-btn.disabled{background:#e9ecef;color:#adb5bd;cursor:not-allowed;pointer-events:none;}
  .idx-empty{text-align:center;color:var(--muted);padding:48px 10px;font-size:16px;}
  footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px;}
  .brand{text-align:center;margin-bottom:12px;}
  .brand-logo{max-width:180px;height:auto;display:inline-block;opacity:.95;}
</style></head><body>
<header><h1>天悦课本伴学 · 全部学期</h1>
      <p>小学 / 初中 / 高中 · 按年级选择学期</p>
      <p>点开年级卡片里的「上册 / 下册」进入对应听读主页</p></header>
<div class="tabs"><span class="tab idx-tab active" data-s="小学">小学</span><span class="tab idx-tab" data-s="初中">初中</span><span class="tab idx-tab" data-s="高中">高中</span></div>
<div class="wrap">
<div class="idx-stage" data-s="小学">
<div class="idx-grid"><div class="idx-card"><div class="idx-grade">一年级</div><div class="idx-btns"><a class="idx-btn disabled">上册（待建）</a><a class="idx-btn disabled">下册（待建）</a></div></div><div class="idx-card"><div class="idx-grade">二年级</div><div class="idx-btns"><a class="idx-btn disabled">上册（待建）</a><a class="idx-btn disabled">下册（待建）</a></div></div><div class="idx-card"><div class="idx-grade">三年级</div><div class="idx-btns"><a class="idx-btn" href="G3S1/index.html">上册</a><a class="idx-btn disabled">下册（待建）</a></div></div><div class="idx-card"><div class="idx-grade">四年级</div><div class="idx-btns"><a class="idx-btn disabled">上册（待建）</a><a class="idx-btn disabled">下册（待建）</a></div></div><div class="idx-card"><div class="idx-grade">五年级</div><div class="idx-btns"><a class="idx-btn disabled">上册（待建）</a><a class="idx-btn disabled">下册（待建）</a></div></div><div class="idx-card"><div class="idx-grade">六年级</div><div class="idx-btns"><a class="idx-btn disabled">上册（待建）</a><a class="idx-btn disabled">下册（待建）</a></div></div></div>
</div>
<div class="idx-stage" data-s="初中" style="display:none">
<div class="idx-empty">🚧 敬请期待</div>
</div>
<div class="idx-stage" data-s="高中" style="display:none">
<div class="idx-empty">🚧 敬请期待</div>
</div>
</div>
<footer><div class="brand"><img class="brand-logo" src="/assets/logo.png" alt="天悦伴学品牌标识"></div><div class="copyright">版权所有：Viola&amp;Daddy ｜ wilson2000@vip.163.com</div></footer>
<script>
  const tabs=document.querySelectorAll('.idx-tab');
  const secs=document.querySelectorAll('.idx-stage');
  function showStage(s){tabs.forEach(t=>t.classList.toggle('active',t.dataset.s===s));secs.forEach(x=>x.style.display=x.dataset.s===s?'block':'none');}
  tabs.forEach(t=>t.addEventListener('click',function(){location.hash=t.dataset.s;showStage(t.dataset.s);}));
  function init(){const h=decodeURIComponent(location.hash.replace('#',''));const ss=[...tabs].map(t=>t.dataset.s);showStage(ss.includes(h)?h:ss[0]);}
  init();window.addEventListener('hashchange',init);
</script></body></html>
